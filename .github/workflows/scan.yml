name: sniper-radar

on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17 (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/scan.yml", "scanner.py", "build_page.py", "desk/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sniper-radar
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests     # rules must pass before anything runs

  radar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Collect early buyers
        run: python scanner.py --minutes 40 --max-tokens 150
        env: { RPC_URL: "${{ secrets.RPC_URL }}" }
      - name: Save data
        if: always()
        run: |
          git config user.name "sniper-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/log
          git diff --cached --quiet || git commit -m "radar data"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i*4)); done; [ "$ok" = 1 ]

  desk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Paper desk (no real money)
        run: python -m desk.main run --minutes 50
        env: { RPC_URL: "${{ secrets.RPC_URL }}" }
      - name: Save data
        if: always()
        run: |
          git config user.name "sniper-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/desk
          git diff --cached --quiet || git commit -m "desk data"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && { ok=1; break; }; git rebase --abort 2>/dev/null; sleep $((i*4)); done; [ "$ok" = 1 ]

  publish:
    needs: [radar, desk]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python build_page.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
